name: Build Dragon Burst Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dragon-burst-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Download ISO and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}

    steps:
      # 1. Baixar o codigo do repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Restaurar o cache da ISO
      - name: Restore ISO cache
        id: iso-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/BurstLimit.iso
          key: dragon-burst-usa-iso-v1

      # 3. Verificar os secrets do Google Drive
      - name: Validate Google Drive secrets
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::O secret GOOGLE_SERVICE_ACCOUNT_JSON esta vazio."
            exit 1
          fi

          if [ -z "$GOOGLE_DRIVE_FILE_ID" ]; then
            echo "::error::O secret GOOGLE_DRIVE_FILE_ID esta vazio."
            exit 1
          fi

          echo "Secrets encontrados."

      # 4. Preparar Python e autenticacao Google
      - name: Prepare Google Drive downloader
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/drive-venv"

          "$RUNNER_TEMP/drive-venv/bin/pip" install \
            --disable-pip-version-check \
            google-api-python-client \
            google-auth

          printf '%s' "$SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/google-service-account.json"

          chmod 600 "$RUNNER_TEMP/google-service-account.json"

      # 5. Baixar a ISO privada do Google Drive
      - name: Download ISO from private Google Drive
        if: steps.iso-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          export GOOGLE_KEY_FILE="$RUNNER_TEMP/google-service-account.json"
          export ISO_PATH="$RUNNER_TEMP/BurstLimit.iso"

          "$RUNNER_TEMP/drive-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          key_file = os.environ["GOOGLE_KEY_FILE"]
          file_id = os.environ["GOOGLE_DRIVE_FILE_ID"]
          destination = Path(os.environ["ISO_PATH"])

          credentials = service_account.Credentials.from_service_account_file(
              key_file,
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          print("Verificando acesso a ISO...")

          metadata = drive.files().get(
              fileId=file_id,
              fields="id,name,size,mimeType",
              supportsAllDrives=True,
          ).execute()

          print("Arquivo:", metadata.get("name", "ISO"))
          print("Tipo:", metadata.get("mimeType", "desconhecido"))

          expected_size = int(metadata.get("size", 0))

          destination.parent.mkdir(parents=True, exist_ok=True)
          temporary = destination.with_name("BurstLimit.iso.part")

          request = drive.files().get_media(
              fileId=file_id,
              supportsAllDrives=True,
          )

          try:
              with temporary.open("wb") as output:
                  downloader = MediaIoBaseDownload(
                      output,
                      request,
                      chunksize=32 * 1024 * 1024,
                  )

                  done = False

                  while not done:
                      status, done = downloader.next_chunk()

                      if status:
                          print(
                              f"Download: {status.progress() * 100:.1f}%"
                          )

              actual_size = temporary.stat().st_size

              if actual_size == 0:
                  raise RuntimeError("O arquivo baixado esta vazio.")

              if expected_size and actual_size != expected_size:
                  raise RuntimeError(
                      f"Tamanho incorreto: esperado {expected_size}, "
                      f"recebido {actual_size} bytes."
                  )

              temporary.replace(destination)

          except Exception:
              temporary.unlink(missing_ok=True)
              raise

          print("Download concluido.")
          print("Tamanho:", destination.stat().st_size, "bytes")
          print("ISO salva em:", destination)
          PY

      # 6. Guardar a ISO em cache
      - name: Save ISO cache
        if: steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/BurstLimit.iso
          key: dragon-burst-usa-iso-v1

      # 7. Verificar a ISO
      - name: Verify ISO
        shell: bash
        run: |
          set -euo pipefail

          ISO_PATH="$RUNNER_TEMP/BurstLimit.iso"

          if [ ! -s "$ISO_PATH" ]; then
            echo "::error::ISO nao encontrada ou vazia."
            exit 1
          fi

          ls -lh "$ISO_PATH"
          echo "ISO disponivel para a compilacao."

      # 8. Instalar dependencias nativas
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-venv \
            python3-pip \
            pkg-config \
            clang \
            gcc-14 \
            g++-14 \
            libstdc++-14-dev \
            cmake \
            ninja-build \
            build-essential \
            curl \
            unzip \
            zip \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-randr0-dev \
            libxcb-xinerama0-dev \
            libxcb-xinput-dev \
            libxcb-keysyms1-dev \
            libxss-dev \
            libxtst-dev

          echo "===== Clang ====="
          clang --version
          clang++ --version

          echo "===== GCC 14 ====="
          gcc-14 --version
          g++-14 --version

          if [ ! -f /usr/include/X11/extensions/scrnsaver.h ]; then
            echo "::error::O cabecalho XScreenSaver nao foi instalado."
            exit 1
          fi

          if [ ! -f /usr/include/X11/extensions/XTest.h ]; then
            echo "::error::O cabecalho XTEST nao foi instalado."
            exit 1
          fi

          echo "Dependencias nativas encontradas."

      # 9. Configurar Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 10. Configurar Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      # 11. Instalar componentes do Android SDK
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Nao foi possivel localizar o sdkmanager."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 \
              -type f -name sdkmanager -print || true
            exit 1
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      # 12. Preparar o projeto original e o SDK
      - name: Set up Burst Limit and SDK
        shell: bash
        run: |
          set -euo pipefail
          bash tools/setup-external.sh

      # 13. Aplicar os patches
      - name: Apply project patches
        shell: bash
        run: |
          set -euo pipefail
          bash tools/apply-patches.sh

      # 14. Diagnosticar bibliotecas C++
      - name: Diagnose C++23 standard library
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Versoes dos compiladores ====="
          clang++ --version
          g++-14 --version

          echo
          echo "===== Caminhos dos headers usados pelo Clang ====="

          clang++ -std=c++23 -stdlib=libstdc++ \
            -v -E -x c++ /dev/null \
            2>&1 || true

          echo
          echo "===== Localizando o header expected ====="

          printf '#include <expected>\n' |
            clang++ -std=c++23 -stdlib=libstdc++ \
              -H -E -x c++ - \
              >/dev/null 2>"$RUNNER_TEMP/clang-headers.log" || true

          grep -E 'expected|c\+\+/' \
            "$RUNNER_TEMP/clang-headers.log" |
            head -80 || true

          echo
          echo "===== Verificando std::expected com GCC 14 ====="

          cat > "$RUNNER_TEMP/test-expected.cpp" <<'CPP'
          #include <expected>
          #include <vector>

          int main() {
              std::expected<std::vector<int>, int> result =
                  std::vector<int>{1, 2, 3};

              return result.has_value() ? 0 : 1;
          }
          CPP

          g++-14 -std=c++23 \
            "$RUNNER_TEMP/test-expected.cpp" \
            -o "$RUNNER_TEMP/test-expected-gcc14"

          "$RUNNER_TEMP/test-expected-gcc14"

          echo "OK: GCC 14 suporta std::expected."

      # 15. Gerar o codigo nativo com Clang
      - name: Generate Burst Limit native code
        shell: bash
        run: |
          set -euo pipefail

          export CC=clang
          export CXX=clang++

          unset CFLAGS || true
          unset CXXFLAGS || true

          echo "===== Compilador do gerador ====="
          clang --version
          clang++ --version

          echo "===== Testando std::expected antes do codegen ====="

          cat > "$RUNNER_TEMP/test-clang-expected.cpp" <<'CPP'
          #include <expected>
          #include <vector>

          int main() {
              std::expected<std::vector<int>, int> result =
                  std::vector<int>{1, 2, 3};

              return result.has_value() ? 0 : 1;
          }
          CPP

          if clang++ -std=c++23 -stdlib=libstdc++ \
              "$RUNNER_TEMP/test-clang-expected.cpp" \
              -o "$RUNNER_TEMP/test-clang-expected"; then

            "$RUNNER_TEMP/test-clang-expected"
            echo "Clang consegue compilar std::expected."
          else
            echo "::warning::Clang nao disponibiliza std::expected nesta configuracao."
            echo "O codegen sera tentado para identificar a falha real do SDK."
          fi

          echo "===== Executando codegen ====="
          bash tools/codegen.sh "$RUNNER_TEMP/BurstLimit.iso"

      # 16. Compilar o APK ARM64
      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleRelease

      # 17. Verificar o APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::O APK esperado nao foi gerado: $APK"
            echo "APKs encontrados:"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"

      # 18. Disponibilizar o APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Burst-Android-ARM64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # 19. Limpar credenciais temporarias
      - name: Remove temporary Google credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/google-service-account.json"
