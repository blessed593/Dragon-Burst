name: Build Dragon Burst Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android.yml"
      - "app/**"
      - "tools/**"
      - "patches/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: read

concurrency:
  group: dragon-burst-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Download ISO and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ISO_PATH: ${{ runner.temp }}/BurstLimit.iso
      GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}

    steps:
      # --------------------------------------------------
      # 1. Baixar o código do repositório
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Restaurar o cache da ISO
      # --------------------------------------------------
      - name: Restore ISO cache
        id: iso-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/BurstLimit.iso
          key: dragon-burst-usa-iso-v1

      # --------------------------------------------------
      # 3. Verificar os secrets
      # --------------------------------------------------
      - name: Validate Google Drive secrets
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::O secret GOOGLE_SERVICE_ACCOUNT_JSON está vazio."
            exit 1
          fi

          if [ -z "$GOOGLE_DRIVE_FILE_ID" ]; then
            echo "::error::O secret GOOGLE_DRIVE_FILE_ID está vazio."
            exit 1
          fi

          echo "Secrets encontrados."

      # --------------------------------------------------
      # 4. Preparar Python e autenticação Google
      # --------------------------------------------------
      - name: Prepare Google Drive downloader
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/drive-venv"

          "$RUNNER_TEMP/drive-venv/bin/pip" install \
            --disable-pip-version-check \
            google-api-python-client \
            google-auth

          printf '%s' "$SERVICE_ACCOUNT_JSON" \
            > "$RUNNER_TEMP/google-service-account.json"

          chmod 600 "$RUNNER_TEMP/google-service-account.json"

      # --------------------------------------------------
      # 5. Baixar a ISO privada do Google Drive
      # --------------------------------------------------
      - name: Download ISO from private Google Drive
        if: steps.iso-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          export GOOGLE_KEY_FILE="$RUNNER_TEMP/google-service-account.json"
          export ISO_PATH="$RUNNER_TEMP/BurstLimit.iso"

          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          key_file = os.environ["GOOGLE_KEY_FILE"]
          file_id = os.environ["GOOGLE_DRIVE_FILE_ID"]
          destination = Path(os.environ["ISO_PATH"])

          scopes = [
              "https://www.googleapis.com/auth/drive.readonly"
          ]

          print("Autenticando no Google Drive...")

          credentials = service_account.Credentials.from_service_account_file(
              key_file,
              scopes=scopes,
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          print("Verificando acesso ao arquivo...")

          metadata = drive.files().get(
              fileId=file_id,
              fields="id,name,size,mimeType",
              supportsAllDrives=True,
          ).execute()

          print("Arquivo encontrado:", metadata.get("name", "ISO"))
          print("Tipo:", metadata.get("mimeType", "desconhecido"))

          expected_size = int(metadata.get("size", 0))

          destination.parent.mkdir(parents=True, exist_ok=True)
          temporary = destination.with_suffix(".iso.part")

          request = drive.files().get_media(
              fileId=file_id,
              supportsAllDrives=True,
          )

          downloaded = 0

          try:
              with temporary.open("wb") as output:
                  downloader = MediaIoBaseDownload(
                      output,
                      request,
                      chunksize=32 * 1024 * 1024,
                  )

                  done = False

                  while not done:
                      status, done = downloader.next_chunk()
                      downloaded = output.tell()

                      if status:
                          print(
                              f"Download: {status.progress() * 100:.1f}%"
                          )

              if temporary.stat().st_size == 0:
                  raise RuntimeError("O arquivo baixado está vazio.")

              if expected_size and temporary.stat().st_size != expected_size:
                  raise RuntimeError(
                      f"Tamanho incorreto: esperado {expected_size}, "
                      f"recebido {temporary.stat().st_size} bytes."
                  )

              temporary.replace(destination)

          except Exception:
              temporary.unlink(missing_ok=True)
              raise

          print("Download concluído.")
          print("Tamanho:", destination.stat().st_size, "bytes")
          print("ISO salva em:", destination)
          PY

      # --------------------------------------------------
      # 6. Guardar a ISO em cache
      # --------------------------------------------------
      - name: Save ISO cache
        if: steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/BurstLimit.iso
          key: dragon-burst-usa-iso-v1

      # --------------------------------------------------
      # 7. Confirmar que a ISO está disponível
      # --------------------------------------------------
      - name: Verify ISO
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "$ISO_PATH" ]; then
            echo "::error::ISO não encontrada ou vazia."
            exit 1
          fi

          ls -lh "$ISO_PATH"
          echo "ISO disponível para a compilação."

      # --------------------------------------------------
      # 8. Instalar dependências do Linux
      # --------------------------------------------------
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-venv \
            python3-pip \
            pkg-config \
            clang \
            cmake \
            ninja-build \
            build-essential \
            curl \
            unzip \
            zip \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-randr0-dev \
            libxcb-xinerama0-dev \
            libxcb-xinput-dev \
            libxcb-keysyms1-dev

      # --------------------------------------------------
      # 9. Configurar Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 10. Configurar Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      # --------------------------------------------------
      # 11. Preparar o projeto Burst Limit original
      # --------------------------------------------------
      - name: Set up Burst Limit and SDK
        shell: bash
        run: |
          set -euo pipefail

          bash tools/setup-external.sh

      # --------------------------------------------------
      # 12. Aplicar os patches Android
      # --------------------------------------------------
      - name: Apply project patches
        shell: bash
        run: |
          set -euo pipefail

          bash tools/apply-patches.sh

      # --------------------------------------------------
      # 13. Gerar o código nativo usando a ISO
      # --------------------------------------------------
      - name: Generate Burst Limit native code
        shell: bash
        run: |
          set -euo pipefail

          export CC=clang
          export CXX=clang++

          bash tools/codegen.sh "$ISO_PATH"

      # --------------------------------------------------
      # 14. Compilar o APK de release
      # --------------------------------------------------
      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            assembleRelease

      # --------------------------------------------------
      # 15. Verificar o APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::O APK esperado não foi gerado: $APK"
            echo "APKs encontrados:"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"

      # --------------------------------------------------
      # 16. Disponibilizar o APK para download
      # --------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Burst-Android-ARM64
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------
      # 17. Limpar credenciais temporárias
      # --------------------------------------------------
      - name: Remove temporary Google credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/google-service-account.json"
